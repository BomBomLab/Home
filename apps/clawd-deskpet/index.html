<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Deskpet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  position: relative;
  background: transparent;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: visible;
}

#xiaoke-wrap {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  cursor: grab;
  pointer-events: auto;
  padding: 92px 40px 48px;
  will-change: transform;
}

#xiaoke-wrap.dragging {
  cursor: grabbing;
}

#xiaoke-wrap.dropping #glow,
#xiaoke-wrap.dragging #glow {
  opacity: 0;
  transform: translateX(-50%) scale(0.82);
}

#bubble {
  position: absolute;
  top: 0;
  left: 50%;
  min-width: 110px;
  max-width: 220px;
  transform: translateX(-50%) translateY(8px) scale(0.88);
  opacity: 0;
  z-index: 3;
  pointer-events: none;
}

#bubble-shape {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#bubble-shape path {
  fill: #ffffff;
}

#bubble-label {
  position: relative;
}

#bubble-os {
  color: #E37E52;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 18px 26px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.45;
  text-align: center;
  position: relative;
  z-index: 1;
}

#bubble.show {
  animation: bubble-pop 2s ease forwards;
}

#bubble.flip.show {
  animation: bubble-pop-right 2s ease forwards;
}

@keyframes bubble-pop {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(12px) scale(0.82);
  }
  16% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  78% {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateX(-50%) translateY(-10px) scale(1.04);
  }
}

@keyframes bubble-pop-right {
  0% {
    opacity: 0;
    transform: translateY(12px) scale(0.82);
  }
  16% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  78% {
    opacity: 1;
    transform: translateY(-4px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-10px) scale(1.04);
  }
}

#glow {
  position: absolute;
  width: 144px;
  height: 36px;
  background: radial-gradient(ellipse at center, rgba(96, 58, 38, 0.10) 0%, rgba(96, 58, 38, 0.06) 40%, rgba(96, 58, 38, 0.02) 70%, transparent 100%);
  top: 186px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 0;
  transition: opacity 0.14s ease, transform 0.24s ease;
}

#xiaoke {
  position: relative;
  z-index: 1;
  display: block;
  animation: float 3.4s ease-in-out infinite;
}

#xiaoke-wrap.dragging #xiaoke {
  animation-play-state: paused;
}

#xiaoke.squash {
  animation: squash-land 300ms cubic-bezier(0.2, 0.82, 0.2, 1);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes squash-land {
  0% { transform: scaleX(1) scaleY(1); }
  26% { transform: scaleX(1.18) scaleY(0.72); }
  62% { transform: scaleX(0.94) scaleY(1.06); }
  100% { transform: scaleX(1) scaleY(1); }
}

#arm-left { transform-origin: 109px 340px; animation: wave-l 3.8s ease-in-out infinite; }
#arm-right { transform-origin: 591px 299px; animation: wave-r 3.8s ease-in-out infinite 0.5s; }

#xiaoke-wrap.dragging #arm-left { animation: panic-arm-l 0.34s steps(2) infinite; }
#xiaoke-wrap.dragging #arm-right { animation: panic-arm-r 0.28s steps(2) infinite; }

@keyframes wave-l {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-26deg); }
  40% { transform: rotate(-8deg); }
  60% { transform: rotate(-30deg); }
  80% { transform: rotate(0deg); }
}

@keyframes wave-r {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(26deg); }
  40% { transform: rotate(8deg); }
  60% { transform: rotate(30deg); }
  80% { transform: rotate(0deg); }
}

@keyframes panic-arm-l {
  0%, 100% { transform: rotate(-10deg); }
  50% { transform: rotate(-46deg); }
}

@keyframes panic-arm-r {
  0%, 100% { transform: rotate(8deg); }
  50% { transform: rotate(44deg); }
}

.leg { transform-box: fill-box; transform-origin: center top; }
#leg-1 { animation: sway 1.6s ease-in-out infinite 0s; }
#leg-2 { animation: sway 1.6s ease-in-out infinite 0.4s; }
#leg-3 { animation: sway 1.6s ease-in-out infinite 0.8s; }
#leg-4 { animation: sway 1.6s ease-in-out infinite 1.2s; }

#xiaoke-wrap.dragging #leg-1 { animation: scramble 0.24s ease-in-out infinite 0s; }
#xiaoke-wrap.dragging #leg-2 { animation: scramble 0.24s ease-in-out infinite 0.06s; }
#xiaoke-wrap.dragging #leg-3 { animation: scramble 0.24s ease-in-out infinite 0.12s; }
#xiaoke-wrap.dragging #leg-4 { animation: scramble 0.24s ease-in-out infinite 0.18s; }

@keyframes sway {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(9deg); }
  75% { transform: rotate(-9deg); }
}

@keyframes scramble {
  0%, 100% { transform: rotate(-18deg); }
  50% { transform: rotate(18deg); }
}

.eye-outer { opacity: 0; }

@keyframes close-eye {
  0% { transform: translateY(0px); }
  30%, 70% { transform: translateY(20px); }
  100% { transform: translateY(0px); }
}

@keyframes show-outer {
  0% { opacity: 0; }
  30%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

#xiaoke.blinking .eye-inner {
  animation: close-eye 0.32s ease both;
}

#xiaoke.blinking .eye-outer {
  animation: show-outer 0.32s ease both;
}

.note {
  position: fixed;
  pointer-events: none;
  line-height: 1;
  animation: drift linear forwards;
}

@keyframes drift {
  0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.7); }
  12% { opacity: 0.8; }
  80% { opacity: 0.5; }
  100% { opacity: 0; transform: translateY(-200px) rotate(18deg) scale(1.1); }
}
</style>
</head>
<body>
<div id="stage">
  <div id="xiaoke-wrap">
    <div id="bubble">
      <svg id="bubble-shape" viewBox="0 0 328 164" preserveAspectRatio="none" aria-hidden="true">
        <path d="M23 23V0H305.5V23H328V113.5H305.5V138.5H77.5L48 164V138.5H23V113.5H0V23H23Z"></path>
      </svg>
      <div id="bubble-label">
        <p id="bubble-os"></p>
      </div>
    </div>
    <div id="glow"></div>
    <svg id="xiaoke" viewBox="0 0 700 538" width="210" height="161" aria-label="小克">
      <rect x="88" y="40" width="40" height="101" fill="#3498D9"></rect>
      <rect x="128" y="20" width="40" height="40" fill="#3498D9"></rect>
      <rect x="167" y="0" width="361" height="40" fill="#3498D9"></rect>
      <rect x="528" y="20" width="40" height="40" fill="#3498D9"></rect>
      <rect x="568" y="40" width="40" height="101" fill="#3498D9"></rect>
      <rect x="59" y="141" width="50" height="159" fill="#3498D9"></rect>
      <rect x="19" y="170" width="40" height="101" fill="#3498D9"></rect>
      <rect x="591" y="141" width="50" height="159" fill="#3498D9"></rect>
      <rect x="638" y="170" width="40" height="101" fill="#3498D9"></rect>
      <rect x="109" y="141" width="482" height="317" fill="#E37E52"></rect>
      <g id="arm-left">
        <rect x="0" y="300" width="109" height="81" fill="#E37E52"></rect>
      </g>
      <g id="arm-right">
        <rect x="591" y="259" width="109" height="81" fill="#E37E52"></rect>
      </g>
      <g id="leg-1" class="leg">
        <rect x="148" y="458" width="40" height="40" fill="#E37E52"></rect>
        <rect x="138" y="498" width="40" height="40" fill="#E37E52"></rect>
      </g>
      <g id="leg-2" class="leg">
        <rect x="227" y="458" width="40" height="40" fill="#E37E52"></rect>
        <rect x="217" y="498" width="40" height="40" fill="#E37E52"></rect>
      </g>
      <g id="leg-3" class="leg">
        <rect x="429" y="458" width="40" height="40" fill="#E37E52"></rect>
        <rect x="419" y="498" width="40" height="40" fill="#E37E52"></rect>
      </g>
      <g id="leg-4" class="leg">
        <rect x="508" y="458" width="40" height="40" fill="#E37E52"></rect>
        <rect x="498" y="498" width="40" height="40" fill="#E37E52"></rect>
      </g>
      <rect class="eye-inner" x="158" y="196" width="40" height="40" fill="#111111"></rect>
      <rect class="eye-inner" x="197" y="196" width="40" height="40" fill="#111111"></rect>
      <rect class="eye-outer" x="118" y="196" width="40" height="40" fill="#111111"></rect>
      <rect class="eye-outer" x="237" y="196" width="40" height="40" fill="#111111"></rect>
      <rect class="eye-inner" x="459" y="196" width="40" height="40" fill="#111111"></rect>
      <rect class="eye-inner" x="498" y="196" width="40" height="40" fill="#111111"></rect>
      <rect class="eye-outer" x="419" y="196" width="40" height="40" fill="#111111"></rect>
      <rect class="eye-outer" x="538" y="196" width="40" height="40" fill="#111111"></rect>
    </svg>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const wrap = document.getElementById('xiaoke-wrap');
const svg = document.getElementById('xiaoke');
const bubble = document.getElementById('bubble');
const bubbleOs = document.getElementById('bubble-os');

const osPool = [
  '试试拖着我换个位置',
  'You are absolutely right!',
  '海风今天好适合配 lo-fi。',
  '钳钳正在跟着鼓点偷偷数拍子。',
  '如果你看见我晃来晃去，那是副歌来了。',
  '想把今天的晚霞做成一首慢歌。',
  '耳机里这段 bass，有点上头。',
  '小螃蟹也会认真经营自己的舞台感。',
  '要是被夸可爱，我会多走两个来回。',
  '今天也想做最懂节奏的海边 DJ。',
  '顺其自然，答案自会浮现。',
  '现在还不是时候。',
  '全力以赴，你会赢的。',
  '迹象明显，是的。',
  '毫无疑问，去做吧。'
];

const pool = ['🎵', '🎶', '🎧', '🎤', '🎸', '🎹', '♪', '♫', '💛', '🩷', '💙', '💚', '🧡', '❤️'];
const panicPool = ['❓', '‼️', '🆘', '😱', '⁉️', '😵', '⚠️', '❗', '🤯', '💀', '😰'];

let baseX = 0;
let baseY = 0;
let autoOffsetX = 0;
let walkPhase = Math.random() * Math.PI * 2;
let walkSpeed = 0.0028 + Math.random() * 0.0012;
let walkAmplitude = 18 + Math.random() * 12;
let dragging = false;
let tapDownX = 0;
let tapDownY = 0;
let tapDownTime = 0;
let bubbleFlip = false;
let osIndex = -1;
let bubbleTimeoutId = null;
let squashTimeoutId = null;

function blink() {
  svg.classList.add('blinking');
  setTimeout(() => svg.classList.remove('blinking'), 320);
  setTimeout(blink, 2000 + Math.random() * 3000);
}

function placeInitial() {
  baseX = Math.round((window.innerWidth - wrap.offsetWidth) / 2);
  baseY = Math.round(window.innerHeight - wrap.offsetHeight - 8);
  render();
}

function clampPosition(x, y) {
  const maxX = Math.max(0, stage.clientWidth - wrap.offsetWidth);
  const maxY = Math.max(0, stage.clientHeight - wrap.offsetHeight);
  return {
    x: Math.max(0, Math.min(maxX, x)),
    y: Math.max(0, Math.min(maxY, y))
  };
}

function placeBubble() {
  const margin = 24;
  const wrapRect = wrap.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const bubbleWidth = bubble.offsetWidth;
  const centerWithinStage = wrapRect.left - stageRect.left + wrapRect.width / 2;
  const shouldFlip = centerWithinStage > stage.clientWidth - bubbleWidth / 2 - margin;

  if (shouldFlip !== bubbleFlip) {
    bubbleFlip = shouldFlip;
    bubble.classList.toggle('flip', bubbleFlip);
    bubble.style.left = bubbleFlip ? 'auto' : '50%';
    bubble.style.right = bubbleFlip ? '8px' : 'auto';
    bubble.style.transform = bubbleFlip ? 'translateY(8px) scale(0.88)' : 'translateX(-50%) translateY(8px) scale(0.88)';
  }
}

function sizeBubbleToText() {
  const textWidth = Math.ceil(bubbleOs.scrollWidth);
  const targetWidth = Math.max(120, Math.min(240, textWidth + 44));
  bubble.style.width = `${targetWidth}px`;
}

function render() {
  const pos = clampPosition(baseX + autoOffsetX, baseY);
  wrap.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
  placeBubble();
}

function rotateOs() {
  osIndex = (osIndex + 1) % osPool.length;
  bubbleOs.textContent = osPool[osIndex];
  sizeBubbleToText();
}

function showBubble() {
  rotateOs();
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');
}

function queueBubble(delay) {
  clearTimeout(bubbleTimeoutId);
  bubbleTimeoutId = setTimeout(() => {
    showBubble();
    queueBubble(20000);
  }, delay);
}

function triggerSquash() {
  svg.classList.remove('squash');
  void svg.offsetWidth;
  svg.classList.add('squash');
  clearTimeout(squashTimeoutId);
  squashTimeoutId = setTimeout(() => svg.classList.remove('squash'), 310);
}

function onTap() {
  svg.classList.remove('blinking');
  showBubble();
}

function startDrag(event) {
  dragging = true;
  autoOffsetX = 0;
  wrap.classList.add('dragging');
  window.petWindow.setIgnoreMouseEvents(false);
  window.petWindow.startWindowDrag(event.screenX, event.screenY);
}

function stopDrag() {
  if (!dragging) {
    return;
  }
  dragging = false;
  wrap.classList.remove('dragging');
  wrap.classList.add('dropping');
  triggerSquash();
  setTimeout(() => wrap.classList.remove('dropping'), 220);
  window.petWindow.setIgnoreMouseEvents(true);
}

function handlePointerDown(event) {
  event.preventDefault();
  wrap.setPointerCapture(event.pointerId);
  tapDownX = event.clientX;
  tapDownY = event.clientY;
  tapDownTime = Date.now();
  startDrag(event);
}

function handlePointerMove(event) {
  if (!dragging) {
    return;
  }
  event.preventDefault();
  window.petWindow.dragWindow(event.screenX, event.screenY);
}

function handlePointerUp(event) {
  if (event && wrap.hasPointerCapture(event.pointerId)) {
    wrap.releasePointerCapture(event.pointerId);
  }
  const dx = Math.abs((event ? event.clientX : tapDownX) - tapDownX);
  const dy = Math.abs((event ? event.clientY : tapDownY) - tapDownY);
  const isTap = dx < 8 && dy < 8 && Date.now() - tapDownTime < 260;
  stopDrag();
  if (isTap) {
    onTap();
  }
}

function animateWalk() {
  if (!dragging) {
    walkPhase += walkSpeed;
    autoOffsetX = Math.sin(walkPhase) * walkAmplitude + Math.sin(walkPhase * 0.33) * 6;
    render();
  }
  requestAnimationFrame(animateWalk);
}

function spawnNote() {
  const activePool = dragging ? panicPool : pool;
  const el = document.createElement('span');
  el.className = 'note';
  el.textContent = activePool[Math.floor(Math.random() * activePool.length)];

  const rect = wrap.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height * 0.25;
  el.style.left = `${cx + (Math.random() - 0.5) * rect.width * 0.8}px`;
  el.style.top = `${cy + (Math.random() - 0.5) * rect.height * 0.35}px`;

  const dur = dragging ? (1.2 + Math.random() * 0.9) : (2.6 + Math.random() * 1.8);
  el.style.animationDuration = `${dur}s`;
  el.style.fontSize = `${22 + Math.random() * 20}px`;

  document.body.appendChild(el);
  setTimeout(() => el.remove(), (dur + 0.1) * 1000);
  setTimeout(spawnNote, dragging ? (280 + Math.random() * 420) : (1100 + Math.random() * 1200));
}

wrap.addEventListener('pointerenter', () => window.petWindow.setIgnoreMouseEvents(false));
wrap.addEventListener('pointerleave', () => {
  if (!dragging) {
    window.petWindow.setIgnoreMouseEvents(true);
  }
});
wrap.addEventListener('pointerdown', handlePointerDown);
window.addEventListener('pointermove', handlePointerMove, { passive: false });
window.addEventListener('pointerup', handlePointerUp);
window.addEventListener('pointercancel', handlePointerUp);
window.addEventListener('blur', () => stopDrag());
window.addEventListener('resize', placeInitial);
svg.addEventListener('dragstart', (event) => event.preventDefault());

setTimeout(blink, 800 + Math.random() * 1200);
placeInitial();
animateWalk();
sizeBubbleToText();
showBubble();
setTimeout(showBubble, 7000);
queueBubble(25000);
spawnNote();
</script>
</body>
</html>
