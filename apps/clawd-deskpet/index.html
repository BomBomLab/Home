<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Deskpet</title>
<style>
:root {
  --pet-scale: 0.75;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  position: relative;
  background: transparent;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: visible;
}

#xiaoke-wrap {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 320px;
  cursor: grab;
  pointer-events: auto;
  padding: 78px 48px 40px;
  will-change: transform;
}

#xiaoke-wrap.dragging {
  cursor: grabbing;
}

#xiaoke-wrap.hovering:not(.dragging) #glow {
  opacity: 0.92;
  transform: translateX(-50%) scale(1.08);
}

#xiaoke-wrap.dropping #glow,
#xiaoke-wrap.dragging #glow {
  opacity: 0;
  transform: translateX(-50%) scale(0.82);
}

#bubble {
  position: absolute;
  top: 0;
  left: 50%;
  min-width: 110px;
  max-width: 220px;
  transform: translateX(-50%) translateY(8px) scale(0.88);
  opacity: 0;
  z-index: 12;
  pointer-events: none;
}

#bubble-shape {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#bubble-shape path {
  fill: #ffffff;
}

#bubble-label {
  position: relative;
}

#bubble-os {
  color: #E37E52;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 18px 26px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.45;
  text-align: center;
  position: relative;
  z-index: 1;
}

#bubble.show {
  animation: bubble-pop 2s ease forwards;
}

#bubble.flip.show {
  animation: bubble-pop-right 2s ease forwards;
}

@keyframes bubble-pop {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(12px) scale(0.82);
  }
  16% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  78% {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateX(-50%) translateY(-10px) scale(1.04);
  }
}

@keyframes bubble-pop-right {
  0% {
    opacity: 0;
    transform: translateY(12px) scale(0.82);
  }
  16% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  78% {
    opacity: 1;
    transform: translateY(-4px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-10px) scale(1.04);
  }
}

#glow {
  position: absolute;
  width: 144px;
  height: 36px;
  background: radial-gradient(ellipse at center, rgba(96, 58, 38, 0.10) 0%, rgba(96, 58, 38, 0.06) 40%, rgba(96, 58, 38, 0.02) 70%, transparent 100%);
  top: 186px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 0;
  transition: opacity 0.14s ease, transform 0.24s ease;
}

#pet-shell {
  position: relative;
  width: 210px;
  height: 178px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  transform: scale(var(--pet-scale));
  transform-origin: center bottom;
}

#xiaoke {
  position: relative;
  z-index: 1;
  display: block;
  overflow: visible;
  animation: float 3.4s ease-in-out infinite;
}

#xiaoke.working {
  animation: none;
}

#xiaoke-wrap.dragging #xiaoke {
  animation-play-state: paused;
}

#pose-idle,
#pose-working {
  transition: opacity 200ms ease;
}

#xiaoke.squash {
  animation: squash-land 300ms cubic-bezier(0.2, 0.82, 0.2, 1);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes squash-land {
  0% { transform: scaleX(1) scaleY(1); }
  26% { transform: scaleX(1.18) scaleY(0.72); }
  62% { transform: scaleX(0.94) scaleY(1.06); }
  100% { transform: scaleX(1) scaleY(1); }
}

#arm-left { transform-origin: 109px 340px; animation: wave-l 3.8s ease-in-out infinite; }
#arm-right { transform-origin: 591px 299px; animation: wave-r 3.8s ease-in-out infinite 0.5s; }

#xiaoke-wrap.dragging #arm-left { animation: panic-arm-l 0.34s steps(2) infinite; }
#xiaoke-wrap.dragging #arm-right { animation: panic-arm-r 0.28s steps(2) infinite; }
#xiaoke-wrap.hovering:not(.dragging) #arm-left { animation: hover-arm-l 0.72s ease-in-out infinite alternate; }
#xiaoke-wrap.hovering:not(.dragging) #arm-right { animation: hover-arm-r 0.72s ease-in-out infinite alternate; }

@keyframes wave-l {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-26deg); }
  40% { transform: rotate(-8deg); }
  60% { transform: rotate(-30deg); }
  80% { transform: rotate(0deg); }
}

@keyframes wave-r {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(26deg); }
  40% { transform: rotate(8deg); }
  60% { transform: rotate(30deg); }
  80% { transform: rotate(0deg); }
}

@keyframes panic-arm-l {
  0%, 100% { transform: rotate(-10deg); }
  50% { transform: rotate(-46deg); }
}

@keyframes panic-arm-r {
  0%, 100% { transform: rotate(8deg); }
  50% { transform: rotate(44deg); }
}

@keyframes hover-arm-l {
  0% { transform: rotate(-12deg) translateY(0); }
  100% { transform: rotate(-40deg) translateY(-5px); }
}

@keyframes hover-arm-r {
  0% { transform: rotate(10deg) translateY(0); }
  100% { transform: rotate(42deg) translateY(-6px); }
}

.leg { transform-box: fill-box; transform-origin: center top; }
#leg-1 { animation: sway 1.6s ease-in-out infinite 0s; }
#leg-2 { animation: sway 1.6s ease-in-out infinite 0.4s; }
#leg-3 { animation: sway 1.6s ease-in-out infinite 0.8s; }
#leg-4 { animation: sway 1.6s ease-in-out infinite 1.2s; }

#xiaoke-wrap.dragging #leg-1 { animation: scramble 0.24s ease-in-out infinite 0s; }
#xiaoke-wrap.dragging #leg-2 { animation: scramble 0.24s ease-in-out infinite 0.06s; }
#xiaoke-wrap.dragging #leg-3 { animation: scramble 0.24s ease-in-out infinite 0.12s; }
#xiaoke-wrap.dragging #leg-4 { animation: scramble 0.24s ease-in-out infinite 0.18s; }

@keyframes sway {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(9deg); }
  75% { transform: rotate(-9deg); }
}

@keyframes scramble {
  0%, 100% { transform: rotate(-18deg); }
  50% { transform: rotate(18deg); }
}

#working-body,
#type-arm-l,
#type-arm-r {
  transform-box: fill-box;
}

#working-body {
  transform-origin: 44% 72%;
  transform: translateY(0) rotate(-3deg);
}

#type-arm-l {
  transform-origin: 10% 16%;
  transform: translate(-8px, -28px) rotate(-20deg);
}

#type-arm-r {
  transform-origin: 8% 14%;
  transform: translate(10px, 26px) rotate(18deg);
}

#xiaoke.working #working-body {
  animation: working-body 0.68s ease-in-out infinite;
}

#xiaoke.working #type-arm-l {
  animation: type-arm-l 0.22s linear infinite;
}

#xiaoke.working #type-arm-r {
  animation: type-arm-r 0.22s linear infinite;
}

#xiaoke-wrap.dragging #type-arm-l,
#xiaoke-wrap.dragging #type-arm-r {
  animation-play-state: paused;
}

@keyframes working-body {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translate(2px, 4px) rotate(-5deg); }
}

@keyframes type-arm-l {
  0%, 18%, 42% { transform: translate(8px, 28px) rotate(12deg); }
  50%, 78%, 100% { transform: translate(-10px, -34px) rotate(-24deg); }
}

@keyframes type-arm-r {
  0%, 18%, 42% { transform: translate(-8px, -36px) rotate(-14deg); }
  50%, 78%, 100% { transform: translate(10px, 28px) rotate(18deg); }
}

.eye-inner,
.eye-outer,
.eye-blink-bottom {
  transform-box: fill-box;
  transform-origin: center;
}

.eye-inner { opacity: 1; }

.eye-outer { opacity: 0; }

.eye-blink-bottom { opacity: 0; }

@keyframes hide-eye-top {
  0%, 16% { opacity: 1; transform: none; }
  22%, 78% { opacity: 0; transform: none; }
  100% { opacity: 1; transform: none; }
}

@keyframes show-outer {
  0%, 16% { opacity: 0; }
  22%, 78% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes working-eye-top {
  0%, 100% { opacity: 1; transform: translateY(0) scaleY(1); }
  45%, 55% { opacity: 1; transform: translateY(12px) scaleY(0.16); }
}

@keyframes working-eye-bottom {
  0%, 100% { opacity: 1; transform: translateY(0) scaleY(1); }
  45%, 55% { opacity: 1; transform: translateY(-12px) scaleY(0.16); }
}

#xiaoke.blinking .eye-inner-top {
  animation: hide-eye-top 0.52s steps(1, end) both;
}

#xiaoke.blinking .eye-inner-bottom {
  animation: hide-eye-top 0.52s steps(1, end) both;
}

#xiaoke.blinking .eye-outer {
  animation: show-outer 0.52s steps(1, end) both;
}

#xiaoke.blinking .eye-blink-bottom {
  animation: show-outer 0.52s steps(1, end) both;
}

#xiaoke.working.blinking .eye-inner-top {
  animation: working-eye-top 0.24s ease both;
}

#xiaoke.working.blinking .eye-inner-bottom {
  animation: working-eye-bottom 0.24s ease both;
}

#xiaoke.working.blinking .eye-outer,
#xiaoke.working.blinking .eye-blink-bottom {
  animation: none;
  opacity: 0;
}

.note {
  position: fixed;
  pointer-events: none;
  line-height: 1;
  z-index: 4;
  animation: drift linear forwards;
}

.note.key-note {
  color: #FFFFFF;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-weight: 700;
  letter-spacing: 0.06em;
  animation-name: drift-key;
}

@keyframes drift {
  0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.7); }
  12% { opacity: 0.8; }
  80% { opacity: 0.5; }
  100% { opacity: 0; transform: translateY(-200px) rotate(18deg) scale(1.1); }
}

@keyframes drift-key {
  0% { opacity: 0; transform: translate3d(0, 6px, 0) scale(0.82); }
  14% { opacity: 0.96; }
  82% { opacity: 0.68; }
  100% { opacity: 0; transform: translate3d(var(--note-drift-x, 0px), var(--note-rise-y, -148px), 0) scale(1.02); }
}
</style>
</head>

<script>
const stage = document.getElementById('stage');
const wrap = document.getElementById('xiaoke-wrap');
const svg = document.getElementById('xiaoke');
const poseIdle = document.getElementById('pose-idle');
const poseWorking = document.getElementById('pose-working');
const workingKeyboardOrigin = document.getElementById('working-keyboard-origin');
const bubble = document.getElementById('bubble');
const bubbleOs = document.getElementById('bubble-os');

const osPool = [
  '试试拖着我换个位置',
  'You are absolutely right!',
  '海风今天好适合配 lo-fi。',
  '钳钳正在跟着鼓点偷偷数拍子。',
  '如果你看见我晃来晃去，那是副歌来了。',
  '想把今天的晚霞做成一首慢歌。',
  '耳机里这段 bass，有点上头。',
  '小螃蟹也会认真经营自己的舞台感。',
  '要是被夸可爱，我会多走两个来回。',
  '今天也想做最懂节奏的海边 DJ。',
  '顺其自然，答案自会浮现。',
  '现在还不是时候。',
  '全力以赴，你会赢的。',
  '迹象明显，是的。',
  '毫无疑问，去做吧。'
];

const pool = ['🎵', '🎶', '🎧', '🎤', '🎸', '🎹', '♪', '♫', '💛', '🩷', '💙', '💚', '🧡', '❤️'];
const panicPool = ['❓', '‼️', '🆘', '😱', '⁉️', '😵', '⚠️', '❗', '🤯', '💀', '😰'];
const WORKING_TIMEOUT_MS = 3000;
const POSE_FADE_MS = 200;

let baseX = 0;
let baseY = 0;
let autoOffsetX = 0;
let walkPhase = Math.random() * Math.PI * 2;
let walkSpeed = 0.0028 + Math.random() * 0.0012;
let walkAmplitude = 18 + Math.random() * 12;
let dragging = false;
let petState = 'idle';
let tapDownX = 0;
let tapDownY = 0;
let tapDownTime = 0;
let bubbleFlip = false;
let osIndex = -1;
let bubbleTimeoutId = null;
let ambientNoteTimeoutId = null;
let squashTimeoutId = null;
let workingTimeoutId = null;
let poseHideTimeoutId = null;
let removeKeyListener = () => {};
let lastWorkingInputAt = 0;

function blink() {
  svg.classList.add('blinking');
  setTimeout(() => svg.classList.remove('blinking'), 520);
  setTimeout(blink, 2000 + Math.random() * 3000);
}

function placeInitial() {
  baseX = Math.round((window.innerWidth - wrap.offsetWidth) / 2);
  baseY = Math.round(window.innerHeight - wrap.offsetHeight - 8);
  render();
}

function clampPosition(x, y) {
  const maxX = Math.max(0, stage.clientWidth - wrap.offsetWidth);
  const maxY = Math.max(0, stage.clientHeight - wrap.offsetHeight);
  return {
    x: Math.max(0, Math.min(maxX, x)),
    y: Math.max(0, Math.min(maxY, y))
  };
}

function placeBubble() {
  const margin = 24;
  const wrapRect = wrap.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const bubbleWidth = bubble.offsetWidth;
  const centerWithinStage = wrapRect.left - stageRect.left + wrapRect.width / 2;
  const shouldFlip = centerWithinStage > stage.clientWidth - bubbleWidth / 2 - margin;

  if (shouldFlip !== bubbleFlip) {
    bubbleFlip = shouldFlip;
    bubble.classList.toggle('flip', bubbleFlip);
    bubble.style.left = bubbleFlip ? 'auto' : '50%';
    bubble.style.right = bubbleFlip ? '8px' : 'auto';
    bubble.style.transform = bubbleFlip ? 'translateY(8px) scale(0.88)' : 'translateX(-50%) translateY(8px) scale(0.88)';
  }
}

function sizeBubbleToText() {
  const textWidth = Math.ceil(bubbleOs.scrollWidth);
  const targetWidth = Math.max(120, Math.min(240, textWidth + 44));
  bubble.style.width = `${targetWidth}px`;
}

function render() {
  const pos = clampPosition(baseX + autoOffsetX, baseY);
  wrap.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
  placeBubble();
}

function rotateOs() {
  osIndex = (osIndex + 1) % osPool.length;
  bubbleOs.textContent = osPool[osIndex];
  sizeBubbleToText();
}

function showBubble() {
  if (petState !== 'idle' || dragging) {
    return;
  }
  rotateOs();
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');
}

function queueBubble(delay) {
  clearTimeout(bubbleTimeoutId);
  if (petState !== 'idle') {
    return;
  }
  bubbleTimeoutId = setTimeout(() => {
    showBubble();
    queueBubble(20000);
  }, delay);
}

function setPoseVisibility(showWorking) {
  clearTimeout(poseHideTimeoutId);
  poseIdle.style.display = '';
  poseWorking.style.display = '';

  requestAnimationFrame(() => {
    poseIdle.style.opacity = showWorking ? '0' : '1';
    poseWorking.style.opacity = showWorking ? '1' : '0';
  });

  poseHideTimeoutId = setTimeout(() => {
    poseIdle.style.display = showWorking ? 'none' : '';
    poseWorking.style.display = showWorking ? '' : 'none';
  }, POSE_FADE_MS);
}

function getAmbientDelay() {
  if (dragging) {
    return 280 + Math.random() * 420;
  }

  if (petState === 'idle') {
    return 1100 + Math.random() * 1200;
  }

  return null;
}

function queueAmbientNotes(delay = getAmbientDelay()) {
  clearTimeout(ambientNoteTimeoutId);
  if (delay == null) {
    return;
  }

  ambientNoteTimeoutId = setTimeout(() => {
    if (dragging) {
      spawnNote(panicPool[Math.floor(Math.random() * panicPool.length)], { duration: 1.2 + Math.random() * 0.9 });
    } else if (petState === 'idle') {
      spawnNote(pool[Math.floor(Math.random() * pool.length)], { duration: 2.6 + Math.random() * 1.8 });
    }
    queueAmbientNotes();
  }, delay);
}

function applyPetState(nextState) {
  if (petState === nextState) {
    return;
  }

  petState = nextState;
  const isWorking = petState === 'working';
  wrap.classList.toggle('working', isWorking);
  svg.classList.toggle('working', isWorking);
  setPoseVisibility(isWorking);
  queueAmbientNotes();
}

function resetWorkingTimer() {
  lastWorkingInputAt = Date.now();
  clearTimeout(workingTimeoutId);
  workingTimeoutId = setTimeout(() => {
    exitWorking();
  }, WORKING_TIMEOUT_MS);
}

function enterWorking() {
  clearTimeout(bubbleTimeoutId);
  bubble.classList.remove('show');
  svg.classList.remove('blinking');
  autoOffsetX = 0;
  render();

  if (petState !== 'working') {
    applyPetState('working');
  }

  resetWorkingTimer();
}

function exitWorking() {
  clearTimeout(workingTimeoutId);
  lastWorkingInputAt = 0;

  if (petState !== 'idle') {
    applyPetState('idle');
  }

  queueBubble(25000);
}

function triggerSquash() {
  svg.classList.remove('squash');
  void svg.offsetWidth;
  svg.classList.add('squash');
  clearTimeout(squashTimeoutId);
  squashTimeoutId = setTimeout(() => svg.classList.remove('squash'), 310);
}

function onTap() {
  svg.classList.remove('blinking');
  showBubble();
}

function startDrag(event) {
  dragging = true;
  autoOffsetX = 0;
  wrap.classList.add('dragging');
  wrap.classList.remove('hovering');
  window.petWindow.startWindowDrag(event.screenX, event.screenY);
  queueAmbientNotes(120);
}

function stopDrag() {
  if (!dragging) {
    return;
  }
  dragging = false;
  wrap.classList.remove('dragging');
  wrap.classList.add('dropping');
  triggerSquash();
  setTimeout(() => wrap.classList.remove('dropping'), 220);
  window.petWindow.stopWindowDrag();
  queueAmbientNotes();
}

function handlePointerDown(event) {
  event.preventDefault();
  wrap.setPointerCapture(event.pointerId);
  tapDownX = event.clientX;
  tapDownY = event.clientY;
  tapDownTime = Date.now();
  startDrag(event);
}

function handlePointerMove(event) {
  if (!dragging) {
    return;
  }
  event.preventDefault();
  window.petWindow.dragWindow(event.screenX, event.screenY);
}

function handlePointerUp(event) {
  if (event && wrap.hasPointerCapture(event.pointerId)) {
    wrap.releasePointerCapture(event.pointerId);
  }
  const dx = Math.abs((event ? event.clientX : tapDownX) - tapDownX);
  const dy = Math.abs((event ? event.clientY : tapDownY) - tapDownY);
  const isTap = dx < 8 && dy < 8 && Date.now() - tapDownTime < 260;
  stopDrag();
  if (isTap) {
    onTap();
  }
}

function animateWalk() {
  if (petState === 'working' && lastWorkingInputAt && Date.now() - lastWorkingInputAt >= WORKING_TIMEOUT_MS) {
    exitWorking();
  }

  if (!dragging && petState !== 'working') {
    walkPhase += walkSpeed;
    autoOffsetX = Math.sin(walkPhase) * walkAmplitude + Math.sin(walkPhase * 0.33) * 6;
    render();
  } else if (!dragging && autoOffsetX !== 0) {
    autoOffsetX = 0;
    render();
  }
  requestAnimationFrame(animateWalk);
}

function spawnNote(content, options = {}) {
  if (!content) {
    return;
  }

  const isKeyNote = options.kind === 'key';
  const el = document.createElement('span');
  el.className = isKeyNote ? 'note key-note' : 'note';
  el.textContent = content;

  const wrapRect = wrap.getBoundingClientRect();
  const keyboardRect = isKeyNote && petState === 'working' && workingKeyboardOrigin
    ? workingKeyboardOrigin.getBoundingClientRect()
    : null;
  const useKeyboardOrigin = Boolean(keyboardRect && keyboardRect.width > 0 && keyboardRect.height > 0);
  const sourceRect = useKeyboardOrigin ? keyboardRect : wrapRect;
  const cx = useKeyboardOrigin ? sourceRect.left + sourceRect.width * 0.52 : sourceRect.left + sourceRect.width / 2;
  const cy = useKeyboardOrigin ? sourceRect.top - 22 : sourceRect.top + sourceRect.height * (isKeyNote ? 0.18 : 0.25);
  const spreadX = useKeyboardOrigin ? sourceRect.width * 0.32 : sourceRect.width * (isKeyNote ? 0.28 : 0.8);
  const spreadY = useKeyboardOrigin ? 6 : sourceRect.height * (isKeyNote ? 0.12 : 0.35);
  const dur = options.duration ?? (isKeyNote ? (1.0 + Math.random() * 0.25) : (dragging ? (1.2 + Math.random() * 0.9) : (2.6 + Math.random() * 1.8)));

  el.style.left = `${cx + (Math.random() - 0.5) * spreadX}px`;
  el.style.top = `${cy + (Math.random() - 0.5) * spreadY}px`;
  el.style.animationDuration = `${dur}s`;
  el.style.fontSize = `${isKeyNote ? (22 + Math.random() * 5) : (22 + Math.random() * 20)}px`;

  if (isKeyNote) {
    el.style.setProperty('--note-drift-x', `${(Math.random() - 0.5) * 10}px`);
    el.style.setProperty('--note-rise-y', `${-128 - Math.random() * 24}px`);
  }

  document.body.appendChild(el);
  setTimeout(() => el.remove(), (dur + 0.1) * 1000);
}

function handleGlobalKeyDown(payload) {
  const key = typeof payload?.key === 'string' ? payload.key : '';
  const isVisibleChar = key.length === 1
    && !payload?.metaKey
    && !payload?.ctrlKey
    && !payload?.altKey
    && /\S/.test(key);

  if (!isVisibleChar) {
    return;
  }

  enterWorking();

  if (Math.random() < 0.42) {
    spawnNote(key.toUpperCase(), { kind: 'key' });
  }
}

wrap.addEventListener('pointerenter', () => {
  if (!dragging) {
    wrap.classList.add('hovering');
  }
});
wrap.addEventListener('pointerleave', () => {
  if (!dragging) {
    wrap.classList.remove('hovering');
  }
});
wrap.addEventListener('pointerdown', handlePointerDown);
window.addEventListener('pointermove', handlePointerMove, { passive: false });
window.addEventListener('pointerup', handlePointerUp);
window.addEventListener('pointercancel', handlePointerUp);
window.addEventListener('blur', () => stopDrag());
window.addEventListener('resize', placeInitial);
window.addEventListener('beforeunload', () => {
  clearTimeout(bubbleTimeoutId);
  clearTimeout(ambientNoteTimeoutId);
  clearTimeout(squashTimeoutId);
  clearTimeout(workingTimeoutId);
  clearTimeout(poseHideTimeoutId);
  removeKeyListener();
});
svg.addEventListener('dragstart', (event) => event.preventDefault());

removeKeyListener = window.petWindow.onKeyDown(handleGlobalKeyDown);
poseIdle.style.opacity = '1';
poseWorking.style.opacity = '0';
poseWorking.style.display = 'none';
setTimeout(blink, 800 + Math.random() * 1200);
placeInitial();
animateWalk();
sizeBubbleToText();
showBubble();
setTimeout(showBubble, 7000);
queueBubble(25000);
queueAmbientNotes();
</script>
</body>
</html>
