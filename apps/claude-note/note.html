<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记实验室</title>
  <style>
    :root {
      --bg: #f7efe3;
      --panel: rgba(252, 247, 241, 0.96);
      --paper: #f8f1e6;
      --paper-edge: #ddcbb5;
      --ink: #2e2118;
      --ink-soft: #635043;
      --accent: #b96f41;
      --accent-deep: #8f4c29;
      --muted: #967f6d;
      --line: rgba(116, 88, 64, 0.16);
      --shadow:
        0 2px 2px rgba(78, 52, 30, 0.06),
        0 12px 18px rgba(78, 52, 30, 0.06),
        0 32px 44px rgba(78, 52, 30, 0.09),
        0 72px 96px rgba(78, 52, 30, 0.12);
      --panel-width: 24rem;
      --paper-image-1: url("../../assets/paper1.jpg");
      --paper-image-2: url("../../assets/paper2.jpg");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--bg);
      scrollbar-width: none;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      min-height: 100vh;
      display: flex;
      position: relative;
      overflow: visible;
    }

    .panel {
      width: var(--panel-width);
      flex: 0 0 var(--panel-width);
      padding: 2rem;
      background: var(--panel);
      border-right: 1px solid rgba(132, 101, 76, 0.12);
      box-shadow: 18px 0 36px -34px rgba(69, 44, 21, 0.55);
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
      overflow-y: auto;
      position: relative;
      z-index: 2;
    }

    .panel::-webkit-scrollbar {
      display: none;
    }

    .panel {
      scrollbar-width: none;
    }

    .panel-header {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    .panel-title {
      margin: 0;
      font-family: "Baskerville", "Iowan Old Style", "Times New Roman", serif;
      font-size: 2rem;
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: -0.05em;
      color: #38251a;
    }

    .panel-subtitle {
      margin: 0;
      color: var(--ink-soft);
      line-height: 1.6;
      font-size: 0.92rem;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      flex: 1;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .field label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field input,
    .field textarea {
      width: 100%;
      color: var(--ink);
      background: rgba(255, 251, 245, 0.74);
      border: 1px solid rgba(155, 122, 97, 0.16);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
    }

    .field input {
      padding: 0.9rem 1rem;
      border-radius: 1rem;
      font-family: "Baskerville", "Iowan Old Style", "Times New Roman", serif;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }

    .field textarea {
      min-height: 8.5rem;
      resize: vertical;
      padding: 1rem;
      border-radius: 1rem;
      line-height: 1.75;
      font-size: 0.96rem;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(185, 111, 65, 0.48);
      background: rgba(255, 252, 247, 0.95);
      box-shadow: 0 0 0 4px rgba(185, 111, 65, 0.08);
    }

    .actions {
      display: grid;
      grid-template-columns: auto 1fr 1fr;
      gap: 0.75rem;
    }

    .icon-button,
    .ghost-button,
    .primary-button {
      min-height: 3rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease, color 160ms ease;
    }

    .icon-button:hover,
    .ghost-button:hover,
    .primary-button:hover,
    .expand-button:hover {
      transform: translateY(-1px);
    }

    .icon-button {
      width: 3rem;
      background: rgba(255, 248, 239, 0.9);
      border: 1px solid rgba(143, 76, 41, 0.12);
      color: var(--ink-soft);
      box-shadow: 0 10px 16px -18px rgba(61, 39, 22, 0.6);
    }

    .ghost-button {
      background: rgba(255, 248, 239, 0.76);
      border: 1px solid rgba(143, 76, 41, 0.15);
      color: var(--accent-deep);
      font-weight: 600;
    }

    .primary-button {
      background: #ae6840;
      color: #fffaf4;
      font-weight: 600;
      box-shadow: 0 18px 24px -18px rgba(104, 57, 29, 0.9);
    }

    .stage {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem;
      overflow: visible;
      position: relative;
    }

    .stack {
      position: relative;
      width: min(468px, calc(100vw - 3rem));
      aspect-ratio: 3 / 4;
      transition: height 280ms ease, width 280ms ease;
      z-index: 1;
    }

    .stack.expanded {
      aspect-ratio: auto;
      height: auto;
    }

    .stack.expanded .stack-underlay {
      display: none;
    }

    .stack.expanded .card {
      position: relative;
      inset: auto;
      min-height: 0;
    }

    .stack-underlay,
    .card {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(144, 110, 83, 0.24);
      border-radius: 0.65rem;
      background: var(--paper);
    }

    .stack-underlay {
      pointer-events: none;
      box-shadow: 0 22px 40px -34px rgba(78, 52, 30, 0.35);
    }

    .stack-underlay.one {
      transform: rotate(-2.6deg) translate(-10px, 9px);
      background:
        linear-gradient(180deg, rgba(249, 240, 227, 0.94), rgba(239, 223, 202, 0.92)),
        var(--paper-image-2) center / cover no-repeat;
      z-index: 1;
    }

    .stack-underlay.two {
      transform: rotate(1.9deg) translate(8px, 5px);
      background:
        linear-gradient(180deg, rgba(246, 235, 220, 0.95), rgba(236, 218, 196, 0.93)),
        var(--paper-image-1) center / cover no-repeat;
      z-index: 2;
    }

    .card {
      overflow: hidden;
      z-index: 3;
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 252, 246, 0.86), rgba(244, 232, 214, 0.84)),
        var(--paper-image-1) center / cover no-repeat,
        radial-gradient(circle at top right, rgba(202, 157, 117, 0.22), transparent 26%),
        radial-gradient(circle at left 30%, rgba(255, 255, 255, 0.5), transparent 30%);
      background-size: auto, cover, auto, auto;
      mix-blend-mode: normal;
      opacity: 0.98;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        inset 0 -30px 60px rgba(148, 109, 72, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 2rem 2rem 1.6rem;
      gap: 1rem;
    }

    .stack.expanded .card-inner {
      height: auto;
      min-height: 0;
    }

    .header-mark {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.1rem;
    }

    .folio {
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    .ornament {
      width: 2.8rem;
      height: 1px;
      background: linear-gradient(90deg, rgba(185, 111, 65, 0.95), rgba(185, 111, 65, 0.12));
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .preview {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }

    .preview-title {
      margin: 0 0 1.4rem;
      color: #2f2118;
      font-family: "Baskerville", "Didot", "Times New Roman", serif;
      font-size: clamp(2rem, 3vw, 2.8rem);
      line-height: 0.94;
      letter-spacing: -0.06em;
      font-weight: 700;
    }

    .preview-body {
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .stack.expanded .preview-body {
      overflow: visible;
    }

    .content {
      margin: 0;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
      text-align: justify;
      font-family: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", serif;
      font-size: 1.16rem;
      line-height: 1.84;
      letter-spacing: 0.008em;
    }

    .content::first-line {
      color: var(--accent-deep);
      font-size: 1.26em;
      font-style: italic;
      font-weight: 600;
    }

    .notes {
      margin-top: 1.6rem;
      padding: 0.2rem 0 0 1.15rem;
      border-left: 1px solid rgba(160, 123, 96, 0.24);
      color: var(--ink-soft);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 0.84rem;
      line-height: 1.72;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .quote-mark {
      margin-bottom: 0.45rem;
      color: var(--accent);
      font-family: "Baskerville", serif;
      font-size: 1.2rem;
      opacity: 0.75;
    }

    .card-controls {
      display: flex;
      justify-content: center;
      min-height: 1.4rem;
    }

    .expand-button {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: transparent;
      color: var(--accent-deep);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 0.3rem 0;
      cursor: pointer;
      opacity: 0.82;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .expand-button:hover {
      opacity: 1;
    }

    .toggle-icon {
      font-size: 0.95rem;
      line-height: 1;
    }

    .expand-button.hidden {
      display: none;
    }

    .footer {
      padding-top: 1rem;
      margin-top: auto;
      border-top: 1px solid rgba(144, 110, 83, 0.14);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }

    .footer-label {
      display: block;
      color: var(--muted);
      font-size: 0.52rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .footer-date {
      display: block;
      margin-top: 0.28rem;
      color: var(--accent-deep);
      font-family: "Baskerville", "Times New Roman", serif;
      font-size: 0.82rem;
      font-style: italic;
    }

    .footer-id {
      color: var(--muted);
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      opacity: 0.86;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 980px) {
      .app {
        flex-direction: column;
      }

      .panel {
        width: 100%;
        flex-basis: auto;
        border-right: 0;
        border-bottom: 1px solid rgba(132, 101, 76, 0.12);
        box-shadow: none;
      }

      .stage {
        padding: 1.5rem 1rem 2rem;
        align-items: flex-start;
      }
    }

    @media (max-width: 640px) {
      .panel {
        padding: 1.25rem;
      }

      .actions {
        grid-template-columns: 1fr 1fr;
      }

      .icon-button {
        width: 100%;
      }

      .stack,
      .stack.expanded {
        width: min(100%, 440px);
      }

      .card-inner {
        padding: 1.45rem 1.3rem 1.2rem;
      }

      .preview-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel">
      <div class="panel-header">
        <span class="eyebrow">Warm Archive</span>
        <h1 class="panel-title">笔记实验室</h1>
        <p class="panel-subtitle">调整标题、正文和注释，右侧会生成一张更接近纸本藏页质感的卡片，并支持导出保存。</p>
      </div>

      <section class="fields">
        <div class="field">
          <label for="title-input">Title / 标题</label>
          <input id="title-input" type="text" placeholder="Sonnet 18">
        </div>

        <div class="field">
          <label for="content-input">Main Content / 正文</label>
          <textarea id="content-input" placeholder="我可否将你比作夏日？&#10;你却比夏日更可爱，也更温柔；&#10;五月娇蕾常遭狂风摧折，&#10;夏天的租期又未免太短太匆匆。"></textarea>
        </div>

        <div class="field">
          <label for="notes-input">Notes / 注释</label>
          <textarea id="notes-input" placeholder="可选注释或旁白"></textarea>
        </div>
      </section>

      <div class="actions">
        <button id="clear-btn" class="icon-button" type="button" aria-label="清空">⌫</button>
        <button id="copy-btn" class="ghost-button" type="button">复制内容</button>
        <button id="save-btn" class="primary-button" type="button">保存卡片</button>
      </div>
    </aside>

    <section class="stage">
      <div id="stack" class="stack">
        <div class="stack-underlay one" aria-hidden="true"></div>
        <div class="stack-underlay two" aria-hidden="true"></div>

        <article id="card" class="card">
          <div class="card-inner">
            <div class="header-mark">
              <span class="folio">folio 01</span>
              <div class="ornament" aria-hidden="true"></div>
            </div>

            <div class="preview">
              <h2 id="preview-title" class="preview-title">Sonnet 18</h2>

              <div id="preview-body" class="preview-body">
                <p id="preview-content" class="content"></p>

                <aside id="preview-notes" class="notes">
                  <div class="quote-mark">❞</div>
                  <div id="preview-notes-text"></div>
                </aside>
              </div>
            </div>

            <div class="card-controls">
              <button id="toggle-btn" class="expand-button hidden" type="button" title="展开全文" aria-expanded="false">
                <span id="toggle-icon" class="toggle-icon">⌄</span>
                <span id="toggle-label">展开全文</span>
              </button>
            </div>

            <footer class="footer">
              <div>
                <span class="footer-label">Archived</span>
                <span id="footer-date" class="footer-date"></span>
              </div>
              <div id="footer-id" class="footer-id"></div>
            </footer>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var defaults = {
        title: "Sonnet 18",
        content: [
          "我可否将你比作夏日？",
          "你却比夏日更可爱，也更温柔；",
          "五月娇蕾常遭狂风摧折，",
          "夏天的租期又未免太短太匆匆；",
          "有时天上的眼睛照得太炽热，",
          "它金灿灿的面容也常被阴翳遮暗；",
          "一切美好的事物终将凋零，",
          "被机缘或自然无常的代谢所摧残；",
          "但你的永恒夏日不会凋谢，",
          "你所拥有的美也不会失去；",
          "死神也不敢夸口说你在它影里漂泊，",
          "因为你将在不朽的诗行中与时间同在；",
          "只要人能呼吸，眼能看见，",
          "这诗就将长存，并赐予你生命。"
        ].join("\n"),
        notes: ""
      };

      var state = {
        expanded: false,
        needsExpand: false,
        archiveId: Math.floor(Math.random() * 9000 + 1000)
      };

      var titleInput = document.getElementById("title-input");
      var contentInput = document.getElementById("content-input");
      var notesInput = document.getElementById("notes-input");
      var clearBtn = document.getElementById("clear-btn");
      var copyBtn = document.getElementById("copy-btn");
      var saveBtn = document.getElementById("save-btn");
      var toggleBtn = document.getElementById("toggle-btn");
      var toggleIcon = document.getElementById("toggle-icon");
      var toggleLabel = document.getElementById("toggle-label");
      var stack = document.getElementById("stack");
      var previewTitle = document.getElementById("preview-title");
      var previewBody = document.getElementById("preview-body");
      var previewContent = document.getElementById("preview-content");
      var previewNotes = document.getElementById("preview-notes");
      var previewNotesText = document.getElementById("preview-notes-text");
      var footerDate = document.getElementById("footer-date");
      var footerId = document.getElementById("footer-id");
      var styleTag = document.querySelector("style");
      var paperImage1 = new URL("../../assets/paper1.jpg", window.location.href).href;
      var paperImage2 = new URL("../../assets/paper2.jpg", window.location.href).href;

      document.documentElement.style.setProperty("--paper-image-1", 'url("' + paperImage1 + '")');
      document.documentElement.style.setProperty("--paper-image-2", 'url("' + paperImage2 + '")');

      function syncOverflowState() {
        var hadExpanded = state.expanded;
        if (hadExpanded) {
          stack.classList.remove("expanded");
        }

        state.needsExpand = previewBody.scrollHeight > previewBody.clientHeight + 1;

        if (hadExpanded) {
          stack.classList.add("expanded");
        }
      }

      function currentValues() {
        return {
          title: titleInput.value.trim(),
          content: contentInput.value,
          notes: notesInput.value
        };
      }

      function render() {
        var values = currentValues();
        var title = values.title || defaults.title;
        var content = values.content || defaults.content;
        var notes = values.notes || "";
        var showNotes = Boolean(notes || !values.content);

        previewTitle.textContent = title;
        previewContent.textContent = content;
        previewNotesText.textContent = notes || defaults.notes;
        previewNotes.classList.toggle("hidden", !showNotes);

        stack.classList.toggle("expanded", state.expanded);
        syncOverflowState();
        toggleBtn.classList.toggle("hidden", !state.needsExpand && !state.expanded);
        toggleBtn.setAttribute("aria-expanded", String(state.expanded));
        toggleBtn.title = state.expanded ? "收起全文" : "展开全文";
        toggleIcon.textContent = state.expanded ? "⌃" : "⌄";
        toggleLabel.textContent = state.expanded ? "收起全文" : "展开全文";
      }

      async function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }

        var textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        var copied = document.execCommand("copy");
        document.body.removeChild(textArea);
        return copied;
      }

      function flashButton(button, message, timeout) {
        var original = button.textContent;
        button.textContent = message;
        window.setTimeout(function () {
          button.textContent = original;
        }, timeout || 1800);
      }

      function handleInput() {
        render();
      }

      function handleClear() {
        titleInput.value = "";
        contentInput.value = "";
        notesInput.value = "";
        state.expanded = false;
        render();
      }

      async function handleCopy() {
        var values = currentValues();
        var combined = [values.title, values.content, values.notes].join("\n").trim();
        var copyValue = combined || [defaults.title, defaults.content, defaults.notes].join("\n");

        try {
          await copyText(copyValue);
          flashButton(copyBtn, "已复制");
        } catch (error) {
          flashButton(copyBtn, "复制失败");
        }
      }

      function handleToggle() {
        if (!state.needsExpand && !state.expanded) {
          return;
        }
        state.expanded = !state.expanded;
        render();
      }

      function buildExportSvg() {
        var clone = stack.cloneNode(true);
        var bounds = stack.getBoundingClientRect();
        var width = Math.ceil(bounds.width);
        var height = Math.ceil(bounds.height);
        var padding = 40;
        var totalWidth = width + padding * 2;
        var totalHeight = height + padding * 2;

        clone.style.width = width + "px";
        clone.style.height = height + "px";
        clone.style.aspectRatio = "auto";
        clone.style.transform = "none";

        var serializedCard = clone.outerHTML;
        var rootStyles = getComputedStyle(document.documentElement);
        var varNames = [
          "--bg",
          "--panel",
          "--paper",
          "--paper-edge",
          "--ink",
          "--ink-soft",
          "--accent",
          "--accent-deep",
          "--muted",
          "--line",
          "--shadow",
          "--panel-width",
          "--paper-image-1",
          "--paper-image-2"
        ];

        var inlineVars = varNames.map(function (name) {
          return name + ":" + rootStyles.getPropertyValue(name).trim() + ";";
        }).join("");

        return [
          "<svg xmlns='http://www.w3.org/2000/svg' width='" + totalWidth + "' height='" + totalHeight + "' viewBox='0 0 " + totalWidth + " " + totalHeight + "'>",
          "<foreignObject x='0' y='0' width='100%' height='100%'>",
          "<div xmlns='http://www.w3.org/1999/xhtml' style='width:" + totalWidth + "px;height:" + totalHeight + "px;padding:" + padding + "px;background:#f7efe3;" + inlineVars + "'>",
          "<style>" + styleTag.textContent + "</style>",
          serializedCard,
          "</div>",
          "</foreignObject>",
          "</svg>"
        ].join("");
      }

      function triggerDownload(blob, fileName) {
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
      }

      function loadImage(src) {
        return new Promise(function (resolve, reject) {
          var image = new Image();
          image.onload = function () {
            resolve(image);
          };
          image.onerror = reject;
          image.src = src;
        });
      }

      function canvasToBlob(canvas) {
        return new Promise(function (resolve) {
          canvas.toBlob(function (blob) {
            resolve(blob);
          }, "image/png");
        });
      }

      async function handleSave() {
        var fileSlug = (currentValues().title || defaults.title)
          .toLowerCase()
          .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-")
          .replace(/^-+|-+$/g, "") || "note-card";

        var originalText = saveBtn.textContent;
        var finalText = originalText;
        saveBtn.textContent = "保存中...";
        saveBtn.disabled = true;

        try {
          var svg = buildExportSvg();
          var bounds = stack.getBoundingClientRect();
          var padding = 40;
          var totalWidth = Math.ceil(bounds.width) + padding * 2;
          var totalHeight = Math.ceil(bounds.height) + padding * 2;
          var svgBlob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
          var svgUrl = URL.createObjectURL(svgBlob);
          var image = await loadImage(svgUrl);
          var scale = 2;
          var canvas = document.createElement("canvas");
          var context = canvas.getContext("2d");

          canvas.width = totalWidth * scale;
          canvas.height = totalHeight * scale;

          context.scale(scale, scale);
          context.fillStyle = "#f7efe3";
          context.fillRect(0, 0, totalWidth, totalHeight);
          context.drawImage(image, 0, 0, totalWidth, totalHeight);

          URL.revokeObjectURL(svgUrl);

          var pngBlob = await canvasToBlob(canvas);
          if (pngBlob) {
            triggerDownload(pngBlob, fileSlug + ".png");
          } else {
            triggerDownload(svgBlob, fileSlug + ".svg");
          }

          finalText = "已保存";
        } catch (error) {
          try {
            var fallbackBlob = new Blob([buildExportSvg()], { type: "image/svg+xml;charset=utf-8" });
            triggerDownload(fallbackBlob, fileSlug + ".svg");
            finalText = "已保存 SVG";
          } catch (fallbackError) {
            finalText = "保存失败";
          }
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = finalText;
          window.setTimeout(function () {
            saveBtn.textContent = originalText;
          }, 2200);
        }
      }

      titleInput.addEventListener("input", handleInput);
      contentInput.addEventListener("input", handleInput);
      notesInput.addEventListener("input", handleInput);
      clearBtn.addEventListener("click", handleClear);
      copyBtn.addEventListener("click", handleCopy);
      saveBtn.addEventListener("click", handleSave);
      toggleBtn.addEventListener("click", handleToggle);
      window.addEventListener("resize", render);

      footerDate.textContent = new Date().toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
      footerId.textContent = "# " + state.archiveId;

      render();
    }());
  </script>
</body>
</html>
