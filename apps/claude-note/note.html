<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Quiet ivory palette — warm but very low chroma */
      --bg:           #f8f8f6;
      --bg-soft:      #f0f0ec;
      --paper:        #fbf8f2;
      --ink:          #2a2825;
      --ink-soft:     #6b6359;
      --ink-faint:    #9c9287;
      --rule:         rgba(60, 48, 34, 0.09);
      --rule-strong:  rgba(60, 48, 34, 0.16);
      --accent:       #c9784a;   /* warm orange, for the title and accents */
      --accent-soft:  rgba(201, 120, 74, 0.14);

      --serif:    "EB Garamond", "Noto Serif SC", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans:     "Inter", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;

      --panel-width: 22rem;
      --paper-image-1: url("../../assets/paper1.jpg");
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: var(--sans);
      font-weight: 400;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; }

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* ---------- Left panel ---------- */

    .panel {
      width: var(--panel-width);
      flex: 0 0 var(--panel-width);
      padding: 3rem 2.25rem 2rem;
      background: var(--bg);
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .panel::-webkit-scrollbar { display: none; }

    .panel-header {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--ink-soft);
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
    }
    .wordmark .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.7;
    }

    .panel-title {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: 2.1rem;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .panel-subtitle {
      margin: 0;
      color: var(--ink-soft);
      line-height: 1.65;
      font-size: 0.86rem;
      font-weight: 400;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      flex: 1;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* Quieter labels — no ALL CAPS, no aggressive tracking */
    .field label {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--ink-faint);
      letter-spacing: 0.02em;
    }
    .field label em {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-soft);
      font-size: 0.82rem;
      margin-left: 0.25rem;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule-strong);
      outline: none;
      padding: 0.55rem 0 0.65rem;
      border-radius: 0;
      transition: border-color 220ms ease;
      color: var(--ink);
    }

    .field input {
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0.005em;
    }

    .field textarea {
      min-height: 7rem;
      resize: vertical;
      font-family: var(--serif);
      font-size: 0.98rem;
      line-height: 1.7;
      padding-top: 0.65rem;
    }

    .field textarea#notes-input {
      font-style: italic;
      color: var(--ink-soft);
      min-height: 5rem;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--ink-faint);
      opacity: 0.7;
      font-style: italic;
    }

    .field input:focus,
    .field textarea:focus {
      border-bottom-color: var(--accent);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--rule);
    }

    .link-button {
      font-size: 0.83rem;
      color: var(--ink-soft);
      padding: 0.6rem 0;
      letter-spacing: 0.01em;
      transition: color 180ms ease;
      font-weight: 400;
    }
    .link-button:hover { color: var(--ink); }

    .link-button.primary {
      margin-left: auto;
      color: var(--accent);
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .link-button.primary:hover { color: #7a5540; }

    .link-button.primary::after {
      content: "→";
      font-style: normal;
      transition: transform 200ms ease;
    }
    .link-button.primary:hover::after { transform: translateX(2px); }

    .sep {
      width: 1px; height: 0.9rem;
      background: var(--rule-strong);
    }

    /* ---------- Stage + card ---------- */

    .stage {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      position: relative;
      background: var(--bg);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--paper-image-1);
      background-size: cover;
      background-position: center;
      mix-blend-mode: multiply;
      opacity: 0.18;
      pointer-events: none;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.5), transparent 60%);
      pointer-events: none;
    }
    .stage > * { position: relative; z-index: 1; }

    .stack {
      position: relative;
      width: min(460px, calc(100vw - 3rem));
      aspect-ratio: 3 / 4;
      transform: rotate(0deg);
      transform-origin: 50% 60%;
      transition: aspect-ratio 320ms ease, transform 320ms ease;
    }
    .stack.expanded {
      aspect-ratio: auto;
      height: auto;
    }

    .card {
      position: absolute;
      inset: 0;
      background: var(--paper);
      border-radius: 2px;
      box-shadow:
        0 1px 1px rgba(78, 52, 30, 0.04),
        0 3px 6px rgba(78, 52, 30, 0.04),
        0 10px 20px -8px rgba(78, 52, 30, 0.08),
        0 24px 44px -18px rgba(78, 52, 30, 0.12),
        0 50px 80px -36px rgba(78, 52, 30, 0.10);
      overflow: hidden;
    }

    /* Paper texture — real grain, kept whisper-quiet via low opacity + multiply */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--paper-image-1);
      background-size: cover;
      background-position: center;
      mix-blend-mode: multiply;
      opacity: 0.45;
      pointer-events: none;
    }

    /* Soft vignette + warmth highlight layered above the texture */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255, 252, 245, 0.55), transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(222, 210, 192, 0.18), transparent 55%);
      pointer-events: none;
    }

    .stack.expanded .card {
      position: relative;
      inset: auto;
    }

    #preview-body > :is(h1,h2,h3,h4,h5,h6,p,li,dt,dd,blockquote,figcaption,label,span,a,em,strong,small,td,th,caption) {
      opacity: 0.8;
    }

    .card-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 3.2rem 3rem 2.4rem;
      gap: 1.25rem;
      border-radius: 4px;
    }

    .stack.expanded .card-inner {
      height: auto;
      min-height: 0;
    }

    /* Header: gentle left marker with a quiet logo on the right */
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      color: var(--ink-faint);
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.82rem;
      font-weight: 400;
    }
    .card-head .lhs { letter-spacing: 0.01em; }
    .card-head .rhs {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .card-head .head-logo {
      display: block;
      width: 30px;
      height: 30px;
      opacity: 0.2;
      object-fit: contain;
    }

    .preview {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
      gap: 1.3rem;
    }

    .preview-title {
      margin: 0;
      color: var(--accent);
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: 48px;
      line-height: 1;
      letter-spacing: -0.025em;
    }

    .preview-title-sub {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.78rem;
      font-family: var(--sans);
      font-weight: 400;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    .preview-body {
      min-height: 0;
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .stack.expanded .preview-body { overflow: visible; }

    /* Fade-out mask when collapsed and overflowing — removed, card texture made it show as a white band */
    .preview-body.has-fade::after {
      display: none;
    }

    .content {
      margin: 0;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.05rem;
      line-height: 1.85;
      letter-spacing: 0.005em;
    }

    /* Removed the large dropped-cap + orange coloring; a single gentle lead-in instead */
    .content::first-line {
      color: var(--ink);
    }

    /* Notes = inner monologue, rendered as a margin-style note */
    .notes {
      margin-top: 1.6rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--rule);
      color: var(--ink-soft);
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.92rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
    }
    .notes-marker {
      flex: 0 0 auto;
      color: var(--accent);
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      padding-top: 0.1em;
      white-space: nowrap;
      opacity: 0.9;
    }

    /* Monologue teaser: a single-line preview of the inner monologue */
    .monologue-teaser {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 1.25rem;
      color: var(--accent);
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .monologue-teaser .marker {
      flex: 0 0 auto;
      color: var(--accent);
      opacity: 0.9;
      font-family: var(--serif);
      font-size: 1.4rem;
      line-height: 0;
      transform: translateY(0.12em);
      white-space: nowrap;
    }
    .monologue-teaser .text {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--accent);
    }
    .monologue-teaser.hidden { display: none; }

    .expand-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      color: var(--ink-faint);
      font-family: var(--serif);
      transition: color 180ms ease;
      padding: 0;
    }
    .expand-button:hover { color: var(--accent); }
    .expand-button.hidden { display: none; }
    .toggle-icon { font-size: 0.95rem; line-height: 1; transition: transform 260ms ease; display: inline-block; }
    .expand-button[aria-expanded="true"] .toggle-icon { transform: rotate(180deg); }

    /* Footer: just a quiet signature line */
    .card-foot {
      margin-top: 0.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--ink-faint);
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.8rem;
      font-weight: 400;
    }
    .card-foot .foot-right {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }
    .card-foot .signature {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }
    .hidden { display: none !important; }

    /* Ink-on-paper text fusion — subtle shadow to mimic ink absorbed into paper grain */
    .content { text-shadow: 0 0.5px 2px rgba(60, 48, 34, 0.07); }
    .preview-title { text-shadow: 0 1px 5px rgba(201, 120, 74, 0.13); }
    .notes { text-shadow: 0 0.5px 2px rgba(60, 48, 34, 0.06); }
    .card-head, .card-foot { text-shadow: 0 0.5px 2px rgba(60, 48, 34, 0.05); }

    /* Panel handle — hidden on desktop, shown on mobile */
    .panel-handle { display: none; }
    .panel-handle .handle-pill {
      width: 36px; height: 4px;
      background: var(--rule-strong);
      border-radius: 2px;
    }

    /* On desktop, panel-body is transparent so the existing flex layout is unchanged */
    .panel-body { display: contents; }

    /* ---------- Responsive ---------- */

    @media (max-width: 980px) {
      .app { flex-direction: column; }
      .panel {
        width: 100%;
        flex-basis: auto;
        border-right: 0;
        border-bottom: 1px solid var(--rule);
        padding: 2rem 1.5rem;
      }
      .stage { padding: 2rem 1rem 3rem; align-items: flex-start; }
    }

    @media (max-width: 640px) {
      html, body { overflow: hidden; height: 100%; }

      .app { height: 100vh; height: 100dvh; overflow: hidden; }

      /* Stage becomes full-screen card wallpaper */
      .stage {
        position: fixed;
        inset: 0;
        padding: 1rem 0.75rem calc(136px + 1.5rem);
        z-index: 0;
        align-items: center;
        justify-content: center;
        transition: filter 400ms ease;
      }

      .stage.panel-open { filter: brightness(0.86); }

      .stack {
        width: 460px;
        aspect-ratio: 3 / 4;
        transform: scale(0.8);
        transform-origin: center center;
        transition: transform 400ms cubic-bezier(0.32, 0.72, 0, 1);
      }

      .stage.panel-open .stack { transform: scale(0.8) translateY(-8vh); }

      .card-inner { padding: 2.2rem 1.75rem 1.6rem; }
      .preview-title { font-size: 1.7rem; }

      /* Panel becomes bottom sheet */
      .panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        width: 100%;
        flex: none;
        height: 136px;
        padding: 0;
        border-right: 0;
        border-bottom: 0;
        border-top: none;
        border-radius: 1.25rem 1.25rem 0 0;
        background: rgba(251, 248, 242, 0.95);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: height 400ms cubic-bezier(0.32, 0.72, 0, 1);
        box-shadow: 0 -1px 0 var(--rule), 0 -4px 24px rgba(60, 48, 34, 0.09);
      }

      .panel.expanded { height: 70vh; height: 70dvh; }

      /* Handle bar */
      .panel-handle {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 0 0 136px;
        gap: 0.45rem;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .panel-handle .wordmark { transition: opacity 300ms ease; }
      .panel.expanded .panel-handle .wordmark { opacity: 0; pointer-events: none; }

      .handle-subtitle {
        margin: 0.2rem 0 0;
        font-size: 0.8rem;
        color: var(--ink-faint);
        line-height: 1.55;
        text-align: center;
        padding: 0 2rem;
        transition: opacity 300ms ease;
      }
      .panel.expanded .handle-subtitle { opacity: 0; pointer-events: none; }

      /* Panel scrollable content */
      .panel-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: none;
        padding: 0.25rem 1.5rem 2.5rem;
        gap: 1.75rem;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 280ms ease 60ms, transform 280ms ease 60ms;
      }
      .panel-body::-webkit-scrollbar { display: none; }

      .panel.expanded .panel-body { opacity: 1; transform: translateY(0); }

      /* Hide wordmark in panel-body since handle already shows it */
      .panel-body .panel-header .wordmark { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel">
      <!-- Mobile handle bar -->
      <div class="panel-handle" id="panel-handle">
        <span class="handle-pill" aria-hidden="true"></span>
        <div class="wordmark" aria-hidden="true">
          <span class="dot" aria-hidden="true"></span>
          <span>a quiet note</span>
        </div>
        <p class="handle-subtitle">写一段文字，再写下读它时心里浮起的声音。</p>
      </div>

      <!-- Content: display:contents on desktop, flex column on mobile -->
      <div class="panel-body">
        <div class="panel-header">
          <div class="wordmark">
            <span class="dot" aria-hidden="true"></span>
            <span>a quiet note</span>
          </div>
          <p class="panel-subtitle">写一段文字，再写下读它时心里浮起的声音。右侧会生成一张安静的卡片。</p>
        </div>

        <section class="fields">
          <div class="field">
            <label for="title-input">标题 <em>title</em></label>
            <input id="title-input" type="text" placeholder="Sonnet 18">
          </div>

          <div class="field">
            <label for="content-input">正文 <em>the text</em></label>
            <textarea id="content-input" placeholder="写下一首诗，一段话，或一句让你停下来的句子…"></textarea>
          </div>

          <div class="field">
            <label for="notes-input">心声 <em>inner monologue</em></label>
            <textarea id="notes-input" placeholder="读它的时候，你听见自己在想什么？"></textarea>
          </div>
        </section>

        <div class="actions">
          <button id="clear-btn" class="link-button" type="button">清空</button>
          <span class="sep" aria-hidden="true"></span>
          <button id="copy-btn" class="link-button" type="button">复制</button>
          <button id="save-btn" class="link-button primary" type="button">保存卡片</button>
        </div>
      </div>
    </aside>

    <section class="stage">
      <div id="stack" class="stack">
        <article id="card" class="card">
          <div class="card-inner">
            <header class="card-head">
              <span class="lhs" id="head-left">a note, quietly kept</span>
              <span class="rhs" aria-hidden="true">
                <img class="head-logo" src="../../assets/Claude_logo.svg" alt="">
              </span>
            </header>

            <div class="preview">
              <div>
                <h2 id="preview-title" class="preview-title">Sonnet 18</h2>
                <span id="preview-subtitle" class="preview-title-sub">William Shakespeare · 1609</span>
              </div>

              <div id="preview-body" class="preview-body">
                <p id="preview-content" class="content"></p>

                <aside id="preview-notes" class="notes">
                  <span class="notes-marker">— 心声</span>
                  <div id="preview-notes-text"></div>
                </aside>
              </div>
            </div>

            <div id="monologue-teaser" class="monologue-teaser hidden">
              <span class="marker">“</span>
              <span class="text" id="monologue-teaser-text"></span>
            </div>

            <footer class="card-foot">
              <span class="signature"><span id="foot-date"></span></span>
              <span class="foot-right">
                <span id="foot-mood">kept softly</span>
                <button id="toggle-btn" class="expand-button hidden" type="button" aria-expanded="false" aria-label="展开全文" title="展开全文">
                  <span class="toggle-icon" aria-hidden="true">⌄</span>
                </button>
              </span>
            </footer>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var defaults = {
        title: "Sonnet 18",
        subtitle: "William Shakespeare · 1609",
        content: [
          "我可否将你比作夏日？",
          "你却比夏日更可爱，也更温柔；",
          "五月娇蕾常遭狂风摧折，",
          "夏天的租期又未免太短太匆匆；",
          "有时天上的眼睛照得太炽热，",
          "它金灿灿的面容也常被阴翳遮暗；",
          "一切美好的事物终将凋零，",
          "被机缘或自然无常的代谢所摧残；",
          "但你的永恒夏日不会凋谢，",
          "你所拥有的美也不会失去；",
          "死神也不敢夸口说你在它影里漂泊，",
          "因为你将在不朽的诗行中与时间同在；",
          "只要人能呼吸，眼能看见，",
          "这诗就将长存，并赐予你生命。"
        ].join("\n"),
        notes: [
          "读第一行时，心里其实是迟疑的——把一个人比作夏天，像不像太轻率了？",
          "可读到 “你却比夏日更温柔”，忽然明白他不是在比喻，是在辩护。",
          "最后那一句让我安静了很久：原来他想留下的，不是夏天，是你。"
        ].join("\n")
      };

      var state = {
        expanded: false,
        needsExpand: false
      };

      var $ = function (id) { return document.getElementById(id); };

      var titleInput   = $("title-input");
      var contentInput = $("content-input");
      var notesInput   = $("notes-input");

      var clearBtn  = $("clear-btn");
      var copyBtn   = $("copy-btn");
      var saveBtn   = $("save-btn");
      var toggleBtn = $("toggle-btn");
      var monologueTeaser = $("monologue-teaser");
      var monologueTeaserText = $("monologue-teaser-text");

      var stack = $("stack");
      var previewTitle    = $("preview-title");
      var previewSubtitle = $("preview-subtitle");
      var previewBody     = $("preview-body");
      var previewContent  = $("preview-content");
      var previewNotes    = $("preview-notes");
      var previewNotesText= $("preview-notes-text");

      var footDate = $("foot-date");

      var paperImage1 = new URL("../../assets/paper1.jpg", window.location.href).href;
      var logoImage = new URL("../../assets/Claude_logo.svg", window.location.href).href;
      var assetCache = Object.create(null);

      document.documentElement.style.setProperty("--paper-image-1", 'url("' + paperImage1 + '")');

      // Dates — quiet, lowercase, no "ARCHIVED" screaming
      var today = new Date();
      var footFmt = today.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }).toLowerCase();
      footDate.textContent = "kept on " + footFmt;

      function currentValues() {
        return {
          title: titleInput.value.trim(),
          content: contentInput.value,
          notes: notesInput.value
        };
      }

      function syncOverflowState() {
        var wasExpanded = state.expanded;
        if (wasExpanded) stack.classList.remove("expanded");

        var overflow = previewBody.scrollHeight > previewBody.clientHeight + 1;
        state.needsExpand = overflow;
        previewBody.classList.toggle("has-fade", overflow);

        if (wasExpanded) stack.classList.add("expanded");
      }

      function render() {
        var v = currentValues();
        var title = v.title || defaults.title;
        var content = v.content || defaults.content;
        var notes = v.notes || (v.content ? "" : defaults.notes);

        previewTitle.textContent = title;
        previewSubtitle.style.display = (title === defaults.title) ? "block" : "none";

        previewContent.textContent = content;
        previewNotesText.textContent = notes;
        previewNotes.classList.toggle("hidden", !notes);

        // Single-line monologue teaser above the footer
        var hasNotes = !!notes;
        monologueTeaser.classList.toggle("hidden", !hasNotes);
        if (hasNotes) {
          // Flatten to a single line — use the first meaningful sentence / line
          var firstLine = notes.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean)[0] || notes;
          monologueTeaserText.textContent = firstLine;
        }

        stack.classList.toggle("expanded", state.expanded);
        syncOverflowState();

        var showToggle = state.needsExpand || state.expanded;
        toggleBtn.classList.toggle("hidden", !showToggle);
        toggleBtn.setAttribute("aria-expanded", String(state.expanded));
        toggleBtn.setAttribute("aria-label", state.expanded ? "收起" : "展开全文");
        toggleBtn.title = state.expanded ? "收起" : "展开全文";
      }

      async function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      }

      function flash(btn, msg, ms) {
        var original = btn.textContent;
        btn.textContent = msg;
        setTimeout(function () { btn.textContent = original; }, ms || 1500);
      }

      function handleInput() { render(); }

      function handleClear() {
        titleInput.value = "";
        contentInput.value = "";
        notesInput.value = "";
        state.expanded = false;
        render();
      }

      async function handleCopy() {
        var v = currentValues();
        var parts = [];
        if (v.title || !v.content) parts.push(v.title || defaults.title);
        parts.push(v.content || defaults.content);
        if (v.notes) { parts.push(""); parts.push("— 心声"); parts.push(v.notes); }
        try {
          await copyText(parts.join("\n"));
          flash(copyBtn, "已复制");
        } catch (e) {
          flash(copyBtn, "复制失败");
        }
      }

      function handleToggle() {
        if (!state.needsExpand && !state.expanded) return;
        state.expanded = !state.expanded;
        render();
      }

      function blobToDataUrl(blob) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onloadend = function () { resolve(reader.result); };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      async function assetUrlToDataUrl(url) {
        if (assetCache[url]) return assetCache[url];

        var response = await fetch(url, { cache: "force-cache" });
        if (!response.ok) {
          throw new Error("Asset request failed: " + response.status);
        }

        var blob = await response.blob();
        var dataUrl = await blobToDataUrl(blob);
        assetCache[url] = dataUrl;
        return dataUrl;
      }

      function copyComputedStyles(sourceEl, targetEl) {
        var computed = getComputedStyle(sourceEl);

        for (var i = 0; i < computed.length; i += 1) {
          var prop = computed[i];
          targetEl.style.setProperty(prop, computed.getPropertyValue(prop), computed.getPropertyPriority(prop));
        }
      }

      function inlineTreeStyles(sourceRoot, targetRoot) {
        copyComputedStyles(sourceRoot, targetRoot);

        var sourceChildren = sourceRoot.children;
        var targetChildren = targetRoot.children;
        for (var i = 0; i < sourceChildren.length; i += 1) {
          inlineTreeStyles(sourceChildren[i], targetChildren[i]);
        }
      }

      function replaceCloneImageSources(root, sourceMap) {
        root.querySelectorAll("img").forEach(function (img) {
          var rawSrc = img.getAttribute("src");
          if (!rawSrc) return;

          var resolvedSrc = new URL(rawSrc, window.location.href).href;
          if (sourceMap[resolvedSrc]) {
            img.setAttribute("src", sourceMap[resolvedSrc]);
          }
        });
      }

      function injectExportCardLayers(cloneRoot, paperDataUrl) {
        var cloneCard = cloneRoot.querySelector(".card");
        if (!cloneCard) return;

        var paperLayer = document.createElement("span");
        paperLayer.setAttribute("aria-hidden", "true");
        paperLayer.style.position = "absolute";
        paperLayer.style.inset = "0";
        paperLayer.style.backgroundImage = 'url("' + paperDataUrl + '")';
        paperLayer.style.backgroundSize = "cover";
        paperLayer.style.backgroundPosition = "center";
        paperLayer.style.mixBlendMode = "multiply";
        paperLayer.style.opacity = "0.45";
        paperLayer.style.pointerEvents = "none";
        paperLayer.style.zIndex = "0";

        var glowLayer = document.createElement("span");
        glowLayer.setAttribute("aria-hidden", "true");
        glowLayer.style.position = "absolute";
        glowLayer.style.inset = "0";
        glowLayer.style.background = [
          "radial-gradient(ellipse at 20% 0%, rgba(255, 252, 245, 0.55), transparent 55%)",
          "radial-gradient(ellipse at 100% 100%, rgba(222, 210, 192, 0.18), transparent 55%)"
        ].join(",");
        glowLayer.style.pointerEvents = "none";
        glowLayer.style.zIndex = "0";

        cloneCard.insertBefore(glowLayer, cloneCard.firstChild);
        cloneCard.insertBefore(paperLayer, glowLayer);
      }

      async function buildExportSvg() {
        var clone = stack.cloneNode(true);
        var bounds = stack.getBoundingClientRect();
        var width = Math.ceil(bounds.width);
        var height = Math.ceil(bounds.height);
        var padding = 48;
        var totalWidth = width + padding * 2;
        var totalHeight = height + padding * 2;
        var paperImageForExport = await assetUrlToDataUrl(paperImage1);
        var logoImageForExport = await assetUrlToDataUrl(logoImage);
        var sourceMap = {};
        var rootStyles = getComputedStyle(document.documentElement);
        var fontStylesheet = document.querySelector('link[href*="fonts.googleapis.com"]');

        clone.style.width = width + "px";
        clone.style.height = height + "px";
        clone.style.minHeight = height + "px";
        clone.style.aspectRatio = "auto";
        clone.style.transform = "none";
        clone.style.position = "relative";

        inlineTreeStyles(stack, clone);
        sourceMap[logoImage] = logoImageForExport;
        replaceCloneImageSources(clone, sourceMap);
        injectExportCardLayers(clone, paperImageForExport);

        var serialized = clone.outerHTML;
        var fontImport = fontStylesheet ? "@import url('" + fontStylesheet.href + "');" : "";

        return [
          "<svg xmlns='http://www.w3.org/2000/svg' width='" + totalWidth + "' height='" + totalHeight + "' viewBox='0 0 " + totalWidth + " " + totalHeight + "'>",
          "<foreignObject x='0' y='0' width='100%' height='100%'>",
          "<div xmlns='http://www.w3.org/1999/xhtml' style='width:" + totalWidth + "px;height:" + totalHeight + "px;padding:" + padding + "px;background:" + rootStyles.getPropertyValue("--bg").trim() + ";box-sizing:border-box;'>",
          "<style>*{box-sizing:border-box;}" + fontImport + "</style>",
          serialized,
          "</div>",
          "</foreignObject>",
          "</svg>"
        ].join("");
      }

      function triggerDownload(blob, fileName) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }

      function loadImage(src) {
        return new Promise(function (resolve, reject) {
          var img = new Image();
          img.decoding = "sync";
          img.onload = function () { resolve(img); };
          img.onerror = reject;
          img.src = src;
        });
      }

      function canvasToBlob(canvas) {
        return new Promise(function (resolve) {
          canvas.toBlob(function (blob) { resolve(blob); }, "image/png");
        });
      }

      async function handleSave() {
        var v = currentValues();
        var slugSource = v.title || defaults.title;
        var slug = slugSource.toLowerCase()
          .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-")
          .replace(/^-+|-+$/g, "") || "note";

        var original = saveBtn.textContent;
        saveBtn.textContent = "保存中…";
        saveBtn.disabled = true;
        var finalText = original;

        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          var svg = await buildExportSvg();
          var bounds = stack.getBoundingClientRect();
          var padding = 48;
          var totalW = Math.ceil(bounds.width) + padding * 2;
          var totalH = Math.ceil(bounds.height) + padding * 2;
          var svgUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

          var img = await loadImage(svgUrl);
          var scale = 2;
          var canvas = document.createElement("canvas");
          var ctx = canvas.getContext("2d");
          canvas.width = totalW * scale;
          canvas.height = totalH * scale;
          ctx.scale(scale, scale);
          var bgColor = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#f6f2ec";
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, totalW, totalH);
          ctx.drawImage(img, 0, 0, totalW, totalH);

          var png = await canvasToBlob(canvas);
          if (!png) {
            throw new Error("PNG export failed");
          }

          triggerDownload(png, slug + ".png");
          finalText = "已保存 PNG";
        } catch (e) {
          console.error("Save card failed", e);
          finalText = "保存失败";
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = finalText;
          setTimeout(function () { saveBtn.textContent = original; }, 2000);
        }
      }

      titleInput.addEventListener("input", handleInput);
      contentInput.addEventListener("input", handleInput);
      notesInput.addEventListener("input", handleInput);
      clearBtn.addEventListener("click", handleClear);
      copyBtn.addEventListener("click", handleCopy);
      saveBtn.addEventListener("click", handleSave);
      toggleBtn.addEventListener("click", handleToggle);
      window.addEventListener("resize", render);

      // Mobile bottom sheet — expand / collapse
      var panelEl = document.querySelector(".panel");
      var stageEl = document.querySelector(".stage");
      var panelHandleEl = document.getElementById("panel-handle");

      function isMobileSheet() {
        return window.matchMedia("(max-width: 640px)").matches;
      }

      function setPanelOpen(open) {
        panelEl.classList.toggle("expanded", open);
        stageEl.classList.toggle("panel-open", open);
      }

      panelHandleEl.addEventListener("click", function () {
        if (!isMobileSheet()) return;
        setPanelOpen(!panelEl.classList.contains("expanded"));
      });

      [titleInput, contentInput, notesInput].forEach(function (inp) {
        inp.addEventListener("focus", function () {
          if (isMobileSheet()) setPanelOpen(true);
        });
      });

      stageEl.addEventListener("click", function () {
        if (isMobileSheet() && panelEl.classList.contains("expanded")) {
          setPanelOpen(false);
        }
      });

      render();
    }());
  </script>
</body>
</html>
